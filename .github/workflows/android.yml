name: Build APK Android

# Produce l'APK installabile su tablet e telefoni Android.
# L'artefatto si scarica dalla pagina del run, in fondo, sotto "Artifacts".

on:
  push:
    # Anche i rami di lavoro producono un APK, così si può provare la build
    # su un dispositivo reale prima di unire le modifiche.
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Build web
        # Le build native caricano i file da disco: serve il base relativo,
        # quindi qui NON impostiamo VITE_BASE.
        run: npm run build

      - name: Sincronizza Capacitor
        run: npx cap sync android

      - name: Compila APK di debug
        # L'APK di debug è firmato con la chiave di debug di Android: si
        # installa direttamente (va abilitata l'installazione da origini
        # sconosciute), senza bisogno di un keystore di rilascio.
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Rinomina l'APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "artifacts/CAA-Facile-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: CAA-Facile-APK
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 90
