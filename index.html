<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
    <!-- viewport-fit=cover + gli offset env(safe-area-inset-*) evitano che la
         barra gesture di iPhone copra i controlli in fondo alle schermate. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Strumenti di Comunicazione Aumentativa Alternativa: griglie di comunicazione, agende visive, token economy, storie sociali, PECS da stampare e timer visivi. Funziona offline." />
    <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CAA Facile" />
    <title>CAA Facile</title>
    <style>
      /* Evita il lampo bianco al primo paint quando il tema salvato è scuro. */
      html.dark, html.dark body { background-color: #0f172a; }
    </style>
    <script>
      // Applica il tema salvato prima che React monti, così non si vede il cambio.
      try {
        var saved = localStorage.getItem('caa_dark_mode');
        var dark = saved === null
          ? window.matchMedia('(prefers-color-scheme: dark)').matches
          : saved === 'true';
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
